name: "Helm deploy Action"
description: "GitHub Action to install/upgrade services using Helm"
inputs:
  deploy_mode:
    description: |
      Deployment mode:
      - 'install' for clean installation
      - 'update' to upgrade an existing release
    required: true
    default: 'install'

  path_to_template:
    description: |
      Path to template file in qubership-test-pipelines repository
      Example: 'templates/consul-service/consul_clean_infra_passport.yml'
    required: true

  service_branch:
    description: |
      Branch in service repository
    required: true

  service_name:
    description: |
      Helm release name
    required: true

  repository_name:
    description: |
      Service repository name (without organization prefix)
      Example: 'qubership-consul' for https://github.com/Netcracker/qubership-consul
    required: true

  path_to_chart:
    description: |
      Path to helm chart within service repository
      Example: 'charts/helm/consul-service'
    required: true

  namespace:
    description: |
      Kubernetes namespace for service installation
    required: true

  resource_folder:
    description: |
      Folder with resources for creating before installation
    required: false

  docker_tag:
    description: "Full docker image"
    required: false

  transfer_image:
    description: "Transfer image that contains the Helm chart"
    required: false
    default: ''

  postgres:
    description: "Postgres installation"
    required: false
    default: 'disable'

  mongo:
    description: "Mongo installation"
    required: false
    default: 'disable'

  kafka:
    description: "Kafka installation"
    required: false
    default: 'disable'

  activemq:
    description: "ActiveMQ installation"
    required: false
    default: 'disable'

  apply_kube2vcs:
    description: "Apply kube2vcs"
    required: false
    default: 'disable'

runs:
  using: 'composite'
  steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        ref: '${{inputs.service_branch}}'
        repository: 'Netcracker/${{inputs.repository_name}}'
        path: '${{inputs.repository_name}}'

    - name: Create namespace
      if: inputs.deploy_mode == 'install'
      shell: bash
      # language=bash
      run: |
        if ! kubectl get namespace ${{inputs.namespace}} >/dev/null 2>&1; then
        kubectl create namespace ${{inputs.namespace}}
        else
        echo "Namespace '${{inputs.namespace}}' already exists"
        fi
        kubectl config set-context --current --namespace=${{inputs.namespace}}

    - name: Create resources
      if: inputs.resource_folder != ''
      shell: bash
      # language=bash
      run: |
        folder="${{inputs.resource_folder}}"
        files=($(find "$folder" -type f))
        echo $files
        for file in "${files[@]}"; do
          echo "Applying $file"
          kubectl create -f "$file"
        done

    - name: Get branch name
      if: inputs.docker_tag == ''
      id: get_branch
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
        else
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Replace slash in branch name
      if: inputs.docker_tag == ''
      id: replace_slash
      shell: bash
      run: |
        SAFE_BRANCH=$(echo "${{ steps.get_branch.outputs.branch }}" | tr '/' '_')
        echo "service_branch_updated=${SAFE_BRANCH}" >> $GITHUB_OUTPUT

    - name: Initialize error flag
      shell: bash
      # language=bash
      run: echo "ERROR_FLAG=false" >> $GITHUB_ENV

    - name: Set DOCKER_TAG
      if: inputs.docker_tag == ''
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BRANCH_NAME="${{ github.head_ref }}"
        else
          BRANCH_NAME="${{ github.ref_name }}"
        fi

        SAFE_BRANCH="${{ steps.replace_slash.outputs.service_branch_updated }}"

        if [[ "$BRANCH_NAME" == "main" ]]; then
          echo "DOCKER_TAG=ghcr.io/netcracker/${{ inputs.repository_name }}:main_latest" >> $GITHUB_ENV
        else
          echo "DOCKER_TAG=ghcr.io/netcracker/${{ inputs.repository_name }}:${SAFE_BRANCH}_latest" >> $GITHUB_ENV
        fi

    - name: Set DOCKER_TAG from input
      if: inputs.docker_tag != ''
      shell: bash
      run: |
        echo "DOCKER_TAG=${{ inputs.docker_tag }}" >> $GITHUB_ENV

    - name: Install Postgres
      if: ${{ inputs.postgres == 'enable' }}
      shell: bash
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami

        helm install my-postgres bitnami/postgresql \
          --set image.registry=docker.io \
          --set image.repository=bitnamilegacy/postgresql \
          --set image.tag=14.2.0 \
          --set auth.username=postgres \
          --set auth.password=postgrestest \
          --set auth.database=postgres

        pod=$(kubectl get pods -o name | head -n 1 | cut -d/ -f2)
        kubectl wait pod "$pod" \
          --for=condition=Ready \
          --timeout=120s || {
          echo "❌ Pod $pod did not become ready in time"
          ERROR_FLAG=true
          exit 1
        }

    - name: Install MongoDB via bitnami
      if: ${{ inputs.mongo == 'enable' }}
      shell: bash
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami

        helm install my-mongodb bitnami/mongodb \
          --set image.registry=docker.io \
          --set image.repository=bitnamilegacy/mongodb \
          --set image.tag=8.0.13 \
          --set auth.rootUser=root \
          --set auth.rootPassword=root

        pod=$(kubectl get pods -o name | grep -vE 'postgres' | head -n 1 | cut -d/ -f2)
        kubectl wait pod "$pod" \
           --for=condition=Ready \
           --timeout=120s || {
           echo "❌ Pod $pod did not become ready in time"
           ERROR_FLAG=true
           exit 1
        }

    - name: Install Kafka via bitnami
      if: ${{ inputs.kafka == 'enable' }}
      shell: bash
      run: |
        cd qubership-testing-platform-helm-hook-helper/.github/templates/
        helm repo add bitnami https://charts.bitnami.com/bitnami

        helm install kafka bitnami/kafka \
          --version 25.0.0 \
          -f no-auth-values.yaml

        pod=$(kubectl get pods -o name | grep -vE 'postgres|mongodb' | head -n 1 | cut -d/ -f2)
        kubectl wait pod "$pod" \
           --for=condition=Ready \
           --timeout=300s || {
           echo "❌ Pod $pod did not become ready in time"
           ERROR_FLAG=true
           exit 1
        }

    - name: Install ActiveMQ via alfresco
      if: ${{ inputs.activemq == 'enable' }}
      shell: bash
      run: |
        helm repo add alfresco https://alfresco.github.io/alfresco-helm-charts/
        helm repo update

        helm install activemq alfresco/activemq

        pod=$(kubectl get pods -o name | grep -vE 'postgres|mongodb|kafka' | head -n 1 | cut -d/ -f2)
        kubectl wait pod "$pod" \
           --for=condition=Ready \
           --timeout=300s || {
           echo "❌ Pod $pod did not become ready in time"
           ERROR_FLAG=true
           exit 1
        }

    - name: Extract chart from transfer image
      if: inputs.transfer_image != ''
      shell: bash
      run: |
        TRANSFER_IMAGE="${{ inputs.transfer_image }}"
        echo "Transfer image: $TRANSFER_IMAGE"

        docker pull "$TRANSFER_IMAGE"

        containername="transfer-${{ github.run_id }}-${RANDOM}"
        docker run --name ${containername} ${TRANSFER_IMAGE} /bin/true || true
        docker cp ${containername}:/deployments .
        ls -la deployments/

    - name: Name template
      shell: bash
      # language=bash
      run: |
        echo ${{inputs.path_to_template}}
        if [ -n "${{ inputs.transfer_image }}" ]; then
          cp ${{inputs.path_to_template}} ${{inputs.path_to_chart}}
        else
          cp ${{inputs.path_to_template}} ${{inputs.repository_name}}/${{inputs.path_to_chart}}
        fi
        ls -la

    - name: Install/update service with helm
      shell: bash
      run: |
        # ▶️ ${{inputs.deploy_mode}} with Helm
        template_name=$(basename "${{inputs.path_to_template}}")
        echo $template_name
        
        if [ "${{ inputs.apply_kube2vcs }}" = "enable" ]; then
          cd qubership-testing-platform-helm-hook-helper/.github/templates/
          kubectl apply -f kube2vcs.yaml
          cd ../../..
        fi

        if [ -n "${{ inputs.transfer_image }}" ]; then
          cd ${{inputs.path_to_chart}}
        else
          cd ${{inputs.repository_name}}/${{inputs.path_to_chart}}
        fi

        set +e
        if [ -n "${{ inputs.docker_tag }}" ] && [ -n "${{ inputs.transfer_image }}" ]; then
          echo "Using docker_tag: ${{ inputs.docker_tag }}"
          echo "Using transfer image: ${{inputs.transfer_image}}"
          helm ${{inputs.deploy_mode}} ${{inputs.service_name}} . -f "${GITHUB_WORKSPACE}/${{ inputs.path_to_template }}" --set-string DOCKER_TAG=${{ env.DOCKER_TAG }}
        elif [ -z "${{ inputs.docker_tag }}" ] && [ -z "${{ inputs.transfer_image }}" ]; then
         echo "DOCKER_TAG calculated from branch name"
         helm ${{inputs.deploy_mode}} ${{inputs.service_name}} . -f $template_name --set-string DOCKER_TAG=${{ env.DOCKER_TAG }}
        fi
        HELM_EXIT_CODE=$?
        set -e

        if [ $HELM_EXIT_CODE -ne 0 ]; then
          echo "❌ Helm install failed"
          echo "Waiting for predeploy pod..."
          kubectl wait --for=condition=ready pod -l job-name=${{inputs.service_name}}-predeploy-install \
            --timeout=60s || true

          PODS=$(kubectl get pods -l job-name=${{inputs.service_name}}-predeploy-install -o name)
          for pod in $PODS; do
            echo "Describe $pod"
            kubectl describe $pod
            echo "End logs"
          done
          echo "Get logs for predeploy-install"
          kubectl logs $(kubectl get pods --selector=job-name=${{inputs.service_name}}-predeploy-install \
            -o jsonpath='{.items[0].metadata.name}')
          echo "End logs"

          exit 1
        fi

        pod=$(kubectl get pods -o name | grep -vE 'postgres|mongodb|kafka|predeploy|activemq' | head -n 1 | cut -d/ -f2)
        kubectl wait pod "$pod" \
           --for=condition=Ready \
           --timeout=600s || {
           echo "❌ Pod $pod did not become ready in time"
           ERROR_FLAG=true
        }

    - name: Get docker images
      shell: bash
      run: |
        # ▶️ Get docker images
        kubectl get pods -o go-template --template="{{range .items}}{{range .spec.containers}}{{.image}} {{end}}{{end}}"
